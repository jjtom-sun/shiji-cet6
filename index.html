    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('cet6studio.v1') || '{}');
        var theme = t && t.settings && t.settings.theme;
        if (theme && theme !== 'auto') document.documentElement.dataset.theme = theme;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch (e) { /* first visit */ }
      document.documentElement.classList.add('js');
    })();
  </script>
